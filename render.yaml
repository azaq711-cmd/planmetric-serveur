# Blueprint Render — crée le service web "planmetric-pro"
# URL obtenue : https://planmetric-pro.onrender.com (si le nom est libre)
services:
  - type: web
    name: planmetric-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 300 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
